[package]
name = "vera2-serve"
description = "HTTP API server for remote Vera code indexing and retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["search", "server", "http", "code-search", "indexing"]
categories = ["development-tools", "web-programming::http-server"]
homepage = "https://github.com/Aristoddle/Vera"
documentation = "https://docs.rs/vera2-serve"

[dependencies]
vera-core = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { version = "0.8", features = ["json", "macros"] }
