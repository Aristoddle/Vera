[package]
name = "vera2-mcp"
description = "MCP server interface for Vera code indexing and retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["mcp", "search", "code-search", "ai", "indexing"]
categories = ["development-tools", "api-bindings"]
homepage = "https://github.com/Aristoddle/Vera"
documentation = "https://docs.rs/vera2-mcp"

[dependencies]
vera-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
notify = "8"
notify-debouncer-mini = "0.6"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
